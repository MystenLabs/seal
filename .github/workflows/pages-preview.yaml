name: Build and deploy GitHub Pages preview for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - "docs/**"
      - ".github/workflows/pages-preview.yaml"

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build-with-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0
        with:
          version: 9
        if: github.event.action != 'closed'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
        if: github.event.action != 'closed'
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - name: Build site
        run: cd docs/site && pnpm run build
        if: github.event.action != 'closed'

  preview:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'MystenLabs'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0
        with:
          version: 9
        if: github.event.action != 'closed'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
        if: github.event.action != 'closed'
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - name: Build site
        run: cd docs/site && DOCUSAURUS_BASE_URL="/seal/pr-preview/pr-${{ github.event.number }}/" pnpm run build
        if: github.event.action != 'closed'
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # pin@v1.8.2
        with:
          source-dir: docs/site/build
