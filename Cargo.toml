[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.15"
authors = ["Mysten Labs <build@mystenlabs.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce", features = ["aes"] }
fastcrypto-tbls = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
bcs = "0.2.1"
serde = "1.0.210"
serde_json = "1.0.150"
itertools = "0.14.0"
anyhow = "1.0"
rand = "0.8.5"
hex = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.37"
serde_with = "3.21.0"
prost-types = "0.14"
tonic = "0.14"
semver = { version = "1.0.28", features = ["serde"] }
once_cell = "1.21.3"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6.11", features = ["cors", "limit"] }
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
reqwest = "0.12"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
prometheus = "0.14.0"
chrono = "0.4"
serde_yaml = "0.9"
snap = "1.1.0"
git-version = "0.3.9"

# Sui dependencies
sui_types = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-types"}
mysten-service = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c" }
sui_sdk = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-sdk"}
sui-json = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-json" }
shared_crypto = { git = "https://github.com/MystenLabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "shared-crypto" }
move-core-types = { git = "https://github.com/MystenLabs/sui.git", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c" }
prometheus_closure_metric = { git = "https://github.com/MystenLabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "prometheus-closure-metric" }
sui-move-build = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-move-build" }
test-cluster = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "test-cluster" }
move-package = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "move-package" }
move-package-compilation = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "move-package-compilation" }
sui-package-alt = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-package-alt" }
sui-rpc-api = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-rpc-api" }
sui_keys = { git = "https://github.com/mystenlabs/sui", rev = "3ae8aecf7c175a83aa97da01d491e053a6090a8c", package = "sui-keys" }

sui-sdk-types = { version = "0.4.0", features = ["serde"] }
sui-rpc = "0.4.0"
sui-crypto = { version = "0.4.0", features = ["ed25519", "secp256k1", "secp256r1", "passkey"] }

[profile.release]
panic = 'abort'
